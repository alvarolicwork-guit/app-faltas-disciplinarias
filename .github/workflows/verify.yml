name: Verify App Faltas
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:domain
      - run: npm run test:imports
      - run: npm install -g firebase-tools@15.1.0
      - run: npm run test:rejection
      - run: npm run test:emulator
      - run: npm run test:corrections
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-app-faltas
          NEXT_PUBLIC_FIREBASE_API_KEY: fake-build-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-app-faltas.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_APP_ID: fake-build-id
